name: ktb_mobile
description: Kottakkal Time Bank — Flutter Android member app (D#94: Android first, iOS later)
publish_to: 'none'
version: 0.1.0+1

# D#94: Android at launch; iOS later using Flutter
# NFR-01: Flutter/Dart Android client

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client for NestJS API calls
  dio: ^5.7.0

  # NFR-11: Offline-first — local encrypted storage
  # FR-OFF-01: Coordinator can capture offline; volunteer can record timer offline
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1

  # FR-UX-01: Malayalam + English at launch; extensible to other Indian languages
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # FR-OFF-01: Background sync on connectivity
  connectivity_plus: ^6.1.0
  workmanager: ^0.5.2

  # FR-MATCH-01: Optional GPS (consent-based, no continuous tracking)
  geolocator: ^13.0.1

  # Push notifications (FR-OFF-05)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Code generation for Riverpod
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
  # FR-UX-01: Localization support
  generate: true
