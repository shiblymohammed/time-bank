include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Enforce const constructors where possible — performance optimization
    prefer_const_constructors: true
    prefer_const_declarations: true
    # Require doc comments on public APIs
    public_member_api_docs: false   # TODO: enable in Milestone 3
    # Avoid print() — use structured logging
    avoid_print: true
    # Require explicit type annotations on public APIs
    always_specify_types: false     # Too verbose for Flutter widgets
    # Catch common mistakes
    avoid_empty_else: true
    avoid_redundant_argument_values: true
    cancel_subscriptions: true
    close_sinks: true

analyzer:
  errors:
    # Treat missing_required_param as error (not just warning)
    missing_required_param: error
    missing_return: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
