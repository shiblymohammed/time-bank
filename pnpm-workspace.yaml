packages:
  # NestJS API backend
  - "apps/api"
  # Next.js web dashboard
  - "apps/web"
  # Next.js public landing page
  - "apps/landing"
  # Shared TypeScript types consumed by both api and web
  - "packages/shared-types"
  # Shared ESLint config
  - "packages/eslint-config"
  # Shared tsconfig bases
  - "packages/tsconfig"
allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@scarf/scarf': false
  bcrypt: true
  protobufjs: true
  unrs-resolver: true

# Compatible security patches; major framework migrations are reviewed separately.
overrides:
  'body-parser@^1.20.0': 1.20.9
  'multer@^2.0.0': 2.5.0
  'qs@^6.0.0': 6.16.1
  'lodash@^4.0.0': 4.18.1
  'postcss@^8.0.0': 8.5.23
  'js-yaml@^4.0.0': 4.3.2
