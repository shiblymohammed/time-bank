# ─── Nginx production configuration ──────────────────────────────────────────
# NFR-02: Reverse proxy layer
# NFR-08: TLS termination, HSTS, security headers
#
# Listens on :80 (redirect only) and :443 (TLS).
# Routes:  /api/*  →  api:3001   (NestJS)
#          /*      →  web:3000   (Next.js)
#
# Prerequisites:
#   - TLS certificate at /etc/letsencrypt/live/<DOMAIN>/fullchain.pem
#   - TLS key at       /etc/letsencrypt/live/<DOMAIN>/privkey.pem
#   - Replace <DOMAIN> with the actual domain (e.g. api.indiantimebank.in)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # ── Rate limiting (brute-force / OTP abuse protection) ──────────────────
    # 30 req/min per IP on auth endpoints (FR-IDENT-01)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
    # 200 req/min per IP on all other API routes
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/m;

    # ── Upstream definitions ─────────────────────────────────────────────────
    upstream api_upstream {
        server api:3001;
        keepalive 16;
    }
    upstream web_upstream {
        server web:3000;
        keepalive 8;
    }

    # ── HTTP → HTTPS redirect (also serves Let's Encrypt ACME challenges) ───
    server {
        listen 80;
        server_name _;

        # Let's Encrypt / Certbot ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main TLS server ──────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name api.indiantimebank.in;   # <── replace with actual domain

        # ── TLS certificates (Let's Encrypt / Certbot) ──────────────────────
        ssl_certificate     /etc/letsencrypt/live/api.indiantimebank.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.indiantimebank.in/privkey.pem;

        # ── TLS hardening ────────────────────────────────────────────────────
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Security headers (NFR-08) ────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ── Auth endpoints — stricter rate limit ─────────────────────────────
        location ~ ^/api/auth/(otp|firebase) {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        # ── All other API and health routes ──────────────────────────────────
        location ~ ^/(api|health)/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # ── Next.js web dashboard ─────────────────────────────────────────────
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }
    }
}
