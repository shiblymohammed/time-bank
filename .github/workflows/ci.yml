name: CI

# Runs on every push and pull request to main.
# NFR-16: Automated unit/integration tests
# NFR-17: Versioned container images; migrations with rollback plan
# D#101: GitHub Actions CI/CD + approved production releases

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '12.3.4'

jobs:
  # ─── Job 1: Lint and type-check ───────────────────────────────────────────
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @ktb/shared-types build

      - name: Type check (all packages)
        run: pnpm typecheck

      - name: Lint (all packages)
        run: pnpm lint

      - name: Format check
        run: pnpm exec prettier --check "**/*.{ts,tsx,js,json,md}" --ignore-path .prettierignore

  # ─── Job 2: Unit tests ───────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @ktb/shared-types build

      - name: Run unit tests
        run: pnpm test

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: '**/coverage/'
          retention-days: 7

  # ─── Job 3: Integration tests (API + real PostgreSQL) ────────────────────
  integration-tests:
    name: Integration Tests (API + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ktb_test
          POSTGRES_PASSWORD: ktb_test_password
          POSTGRES_DB: ktb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ktb_test -d ktb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ktb_test:ktb_test_password@localhost:5432/ktb_test
      NODE_ENV: test
      JWT_SECRET: ci_test_secret_not_for_production_use
      API_PORT: 3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @ktb/shared-types build

      - name: Run migrations against test database
        run: pnpm --filter @ktb/api migration:run

      - name: Run E2E / integration tests
        run: pnpm test:e2e

  matching-concurrency:
    name: Matching Concurrency (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ktb_matching
          POSTGRES_PASSWORD: ktb_matching_ci
          POSTGRES_DB: ktb_matching_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ktb_matching -d ktb_matching_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MATCHING_TEST_DATABASE_URL: postgresql://ktb_matching:ktb_matching_ci@localhost:5432/ktb_matching_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ktb/shared-types build
      - run: pnpm --filter @ktb/api test:matching:integration

  # ─── Job 4: Docker build validation ──────────────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (production stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/Dockerfile.api
          target: production
          push: false
          tags: ktb/api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image (production stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/Dockerfile.web
          target: production
          push: false
          tags: ktb/web:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# The Flutter member app lives in its own repository (apps/mobile/time_bank_flutter, git-ignored here)
# and is analyzed and tested by that repository's CI.
